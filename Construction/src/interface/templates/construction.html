<template id="rielk-construction-template">
  <!-- CONSTRUCTION Content -->
  <div class="content d-none" id="rielk-construction-container">
    <div class="skill-info">
      <skill-header id="skill-id" data-skill-id="rielkConstruction:Construction"
        style="border-bottom-left-radius: 0; border-bottom-right-radius: 0;"></skill-header>
      <rielk-construction-mastery id="rielk-mastery"></rielk-construction-mastery>
    </div>
    <div class="row row-deck" id="rielk-construction-injected-container"></div>
    <div class="row row-deck">
      <realmed-category-menu class="col-12" id="rielk-construction-category-menu"></realmed-category-menu>
      <div class="col-12">
        <div class="block block-rounded block-link-pop border-top border-rielk-construction border-4x">
          <div class="row no-gutters" id="rielk-construction-category-container">
            <div class="col-12 col-md-4" id="rielk-construction-artisan-element">
              <artisan-menu id="rielk-construction-artisan-menu"></artisan-menu>
            </div>
            <div class="col-12 d-none" id="rielk-construction-house-element"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- END CONSTRUCTION Content -->
</template>

<template id="rielk-construction-room-panel-template">
  <div class="block block-rounded border-top border-rielk-construction border-4x">
    <div class="row no-gutters">
      <div class="col-12 pointer-enabled" id="header">
        <div class="block-content text-center">
          <i class="fa fa-eye text-muted mr-2 font-w300" id="eye-icon"></i>
          <span class="h5 font-w600" id="room-name"></span>
        </div>
      </div>
      <div class="col-12 col-md-6 row gutters-tiny">
        <div class="block-content block-content-full text-center" id="target-container"></div>
      </div>
      <div class="col-12 col-md-6">
        <div class="block-content block-content-full" id="info-container">
          <div class="row gutters-tiny">
            <div class="col-12">
              <div class="row row-deck gutters-tiny">
                <div class="col-4" id="image-container">
                  <div class="block block-rounded-double bg-combat-inner-dark text-center p-3">
                    <img class="bank-img-detail" id="product-image">
                  </div>
                </div>
                <div class="col-8" id="details-container">
                  <div class="block block-rounded-double bg-combat-inner-dark pt-2 pl-2 pr-2 pb-1">
                    <h5 class="font-size-sm font-w600 text-muted m-1">
                      <small>
                        <rielk-lang-string lang-id="MENU_TEXT_CONSTRUCT"></rielk-lang-string>
                      </small>
                    </h5>
                    <h5 class="font-w700 text-combat-smoke m-1">
                      <span id="product-name">-</span>
                    </h5>
                    <div class="col-12">
                      <div class="row icon-size-48" id="extra-details-container">
                        <button class="btn btn-sm btn-info m-1 mt-3" role="button" id="upgrades-button">
                          <rielk-lang-string lang-id="MENU_TEXT_SHOW_UPGRADES"></rielk-lang-string>
                        </button>
                        <preservation-icon id="product-preservation"></preservation-icon>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12 block block-rounded-double bg-combat-inner-dark" id="built-progress-container">
                <div class="row no-gutters">
                  <div class="col-md-2"></div>
                  <div class="col-12 col-md-8">
                    <div class="media-body">
                      <div class="font-w400 text-center">
                        <h5 class="font-w400 font-size-sm text-combat-smoke m-1">
                          <small id="built-progress-text">-</small>
                        </h5>
                      </div>
                      <div class="font-size-sm mb-2">
                        <div class="col-12">
                          <progress-bar class="progress-height-5" id="built-progress-bar"></progress-bar>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12 block block-rounded-double bg-combat-inner-dark pt-2 pb-1 text-center"
                id="ingredients-container">
                <div class="row no-gutters">
                  <requires-box class="col-12 col-sm-6 pb-2 icon-size-48" id="requires"></requires-box>
                  <haves-box class="col-12 col-sm-6 pb-2 icon-size-48" id="haves"></haves-box>
                </div>
              </div>
              <div class="col-12 block block-rounded-double bg-combat-inner-dark pt-2 pb-1 text-center"
                id="grants-container">
                <div class="row justify-content-center icon-size-48">
                  <grants-box id="grants"></grants-box>
                </div>
              </div>
              <div class="col-12 block block-rounded-double bg-combat-inner-dark p-3 text-center" id="build-container">
                <div class="row justify-content-center icon-size-48">
                  <button class="btn btn-success m-2 p-2" type="button" style="min-height: 48px;" id="start-button">
                    <rielk-lang-string lang-id="MENU_TEXT_BUILD"></rielk-lang-string>
                  </button>
                  <interval-icon id="interval"></interval-icon>
                  <div class="col-12">
                    <progress-bar class="progress-height-5" id="progress-bar"></progress-bar>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="rielk-construction-fixture-nav-template">
  <ul class="nav nav-pills nav-justified">
    <li class="nav-item mr-1">
      <a class="block block-link-pop nav-link border pointer-enabled font-w600 p-1" id="button">
        <div class="media d-flex align-items-center" id="button-content">
          <div class="m-1">
            <img class="skill-icon-md mr-1" id="fixture-image">
          </div>
          <div class="media-body">
            <div class="text-center">
              <h5 class="font-w700 text-combat-smoke mb-1 d-flex flex-wrap justify-content-center">
                <span id="fixture-name"></span>
              </h5>
              <small id="construction-progress"></small>
            </div>
          </div>
        </div>
        <div class="justify-vertical-center" id="unlock">
          <span class="text-danger" id="level"></span>
          <span class="text-danger" id="abyssal-level"></span>
        </div>
      </a>
    </li>
  </ul>
</template>

<template id="rielk-construction-upgrades-panel-template">
  <div class="block block-rounded border-top border-rielk-construction border-4x">
    <div class="block-content text-center">
      <h5 class="font-w700 text-combat-smoke mb-1 d-flex flex-wrap">
        <span id="fixture-name"></span>
      </h5>
    </div>
    <div class="row no-gutters">
      <div class="col-12">
        <div class="row no-gutters p-2" id="upgrades-container">
        </div>
      </div>
    </div>
  </div>
</template>

<template id="rielk-construction-modifier-display-template">
  <div class="media d-flex align-items-center push m-0 row gutters-tiny">
    <div class="m-1 font-w600">
      <img class="skill-icon-sm mr-2" id="fixture-image">
    </div>
    <div class="media-body">
      <div class="block block-rounded border-top border-rielk-construction border-4x text-left" id="modifier-container">
        <h5 class="font-w700 font-size-sm m-1" id="modifier-text"></h5>
      </div>
      <div class="justify-vertical-center" id="unlock-container">
        <span class="text-danger" id="level"></span>
        <span class="text-danger" id="abyssal-level"></span>
      </div>
    </div>
  </div>
</template>

<template id="tier-mastery-menu">
  <div class="modal fade" id="rielk-tier-mastery-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-xl" role="document" style="max-width: 700px;">
      <div class="modal-content">

        <div class="block block-themed block-transparent mb-3" style="max-width: 700px;">
          <div class="block-header bg-primary-dark">
            <h3 class="block-title"></h3>
            <div class="block-options">
              <button type="button" class="btn-block-option" data-dismiss="modal" aria-label="Close">
                <i class="fa fa-fw fa-times"></i>
              </button>
            </div>
          </div>
          <div class="block-content block-content-full pb-0">
            <!-- Left text first -->
            <div class="mb-4">
              <h3 class="font-w900 text-warning">
                <rielk-lang-string lang-id="MENU_TEXT_WHAT_ARE_HOUSE_TIERS"></rielk-lang-string>
              </h3>
              <p class="font-w500">
                <rielk-lang-string lang-id="MENU_TEXT_HOUSE_TIER_EXPLANATION_1" lang-html="true"></rielk-lang-string>
              </p>
              <p class="font-w500">
                <rielk-lang-string lang-id="MENU_TEXT_HOUSE_TIER_EXPLANATION_2" lang-html="true"></rielk-lang-string>
              </p>
            </div>

            <div id="pips-container" class="d-flex flex-column gap-2">
              <!--There could be a way to do this dynamically. Could.-->
              <tier-mastery-bonus id="tier-1"></tier-mastery-bonus>

              <tier-mastery-bonus id="tier-2"></tier-mastery-bonus>

              <tier-mastery-bonus id="tier-3"></tier-mastery-bonus>

              <tier-mastery-bonus id="tier-4"></tier-mastery-bonus>

              <tier-mastery-bonus id="tier-5"></tier-mastery-bonus>

              <tier-mastery-bonus id="tier-6"></tier-mastery-bonus>

              <tier-mastery-bonus id="tier-7"></tier-mastery-bonus>

              <tier-mastery-bonus id="tier-8"></tier-mastery-bonus>

            </div>
          </div>
        </div>


      </div>
    </div>
  </div>
</template>




<template id="tier-mastery-bonus">
  <div class="col-12 d-none" id="activation">
    <h5 id="tier-title" class="mb-1"> </h5>
    <div class="block block-rounded-double bg-combat-inner-dark p-2 mb-2">
      <div class="media d-flex align-items-center push mb-0">
        <!-- Fixture count -->
        <div class="mr-3">
          <h3 id="fixture-count" class="font-w700 text-danger mb-0"></h3>
        </div>

        <div class="media-body">
          <div class="font-w600 font-size-sm justify-vertical-center text-center">

            <!-- Passive Bonuses -->
            <div id="modifier-container" class="d-none">
              <h5 class="mb-0"></h5>
              <div id="modifier-list" class="justify-vertical-center"></div>
            </div>

            <!-- Rewards -->
            <div id="reward-container">
              <h5 class="mb-0"><rielk-lang-string lang-id="MENU_TEXT_REWARDS">Rewards</lang-string></h5>
              <div id="reward-list" class="justify-horizontal-center"></div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</template>


<template id="rielk-construction-mastery">
  <div id="skill-boosts-append" class="d-flex flex-column">
    <div class="block block-link-pop p-2 mb-2 w-100" style="border-radius: 0 0 0.25rem 0.25rem; overflow: hidden;">
      <div class="d-flex align-items-center">
        <div class="m-1 d-flex align-items-start">
          <img class="skill-icon-md mr-2" id="house-image">
        </div>
        <div class="media-body flex-column w-100">
          <div class="d-flex flex-column w-100">
            <h5 class="font-w700 text-combat-smoke mb-2">
              <rielk-lang-string lang-id="MENU_HOUSE_COMPLETION"></rielk-lang-string>
            </h5>
            <div class="d-flex w-100 mb-1" id="mastery-bars-container">
            </div>
            <div class="d-flex w-100 mb-1 justify-content-between">
              <small id="tiers-completed-aggregate" class="font-w400 font-size-sm text-combat-smoke"></small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
